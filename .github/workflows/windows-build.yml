name: Build FaceMatch for Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            desktop/windows/requirements-build.txt
      - name: Install build dependencies
        run: |
          python -m pip install -r desktop/windows/requirements-build.txt
          python -m pip check
      - name: Run application regression checks
        run: python -B -m unittest discover -s tests -v
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build and check frozen models
        run: python scripts/build_windows_app.py --output dist/windows-ci --load-models
      - name: Check installer lifecycle without private photographs
        shell: pwsh
        run: ./desktop/windows/test_installer.ps1 -Artifacts "$PWD/dist/windows-ci/artifacts"
      - name: Upload development build and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: FaceMatch-Windows-x64-development
          path: dist/windows-ci/artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
